<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mutlu yıllar Elizan!</title>
<meta name="description" content="Elizan'ın 16. doğum günü için hazırlanmış sürprizlerle dolu bir sayfa.">
<meta property="og:title" content="Mutlu yıllar Elizan! 🎂">
<meta property="og:description" content="16. yaşın için hazırlanmış sürprizlerle dolu bir sayfa. Önce kutuyu aç!">
<meta name="theme-color" content="#E0245E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%82%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Nunito:wght@400;600;800;900&family=Caveat:wght@500;700&display=swap">
<style id="s">
/* Layout: şeker pembe parti sayfası; dikey bölümler, eğik çıkartmalar, büyük Shrikhand başlıklar */
:root{
  --bg:#FFE6EE;--paper:#FFF7FA;--ink:#3B0B25;--muted:#8A4D68;--line:#F2BCD0;
  --cherry:#E0245E;--gold:#FFB020;--teal:#0E9F9A;--onacc:#FFF7FA;
  --display:'Shrikhand',Georgia,serif;--body:'Nunito',system-ui,-apple-system,sans-serif;--hand:'Caveat','Comic Sans MS',cursive;
  --shadow:0 10px 30px -12px rgba(120,10,60,.35);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C0A14;--paper:#2A1220;--ink:#FFE6EE;--muted:#D79AB4;--line:#4A2235;
  --cherry:#FF4F86;--gold:#FFC24D;--teal:#3FD1C9;--onacc:#1C0A14;--shadow:0 10px 30px -12px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C0A14;--paper:#2A1220;--ink:#FFE6EE;--muted:#D79AB4;--line:#4A2235;
  --cherry:#FF4F86;--gold:#FFC24D;--teal:#3FD1C9;--onacc:#1C0A14;--shadow:0 10px 30px -12px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;overflow-x:hidden;
  background-image:radial-gradient(var(--line) 1.4px,transparent 1.6px);background-size:22px 22px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{padding-block:72px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.05;text-wrap:balance;margin:0}
h2{font-size:clamp(2.2rem,7vw,3.6rem);color:var(--cherry)}
.eyebrow{font-weight:900;font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--teal);margin-bottom:10px}
.lead{color:var(--muted);max-width:60ch;margin:14px 0 0}
.head{margin-bottom:34px}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:0;border-radius:999px;padding:12px 22px;font-weight:900;background:var(--cherry);color:var(--onacc);box-shadow:0 4px 0 var(--ink);transition:transform .12s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--paper);color:var(--ink);border:2px solid var(--ink)}
.btn.gold{background:var(--gold);color:#3B0B25}
:focus-visible{outline:3px solid var(--teal);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* nav */
nav.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:2px solid var(--line)}
nav.top .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:10px;scrollbar-width:none}
nav.top .wrap::-webkit-scrollbar{display:none}
nav.top a{flex:none;text-decoration:none;color:var(--ink);font-weight:800;font-size:.9rem;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--paper)}
nav.top a:hover{border-color:var(--cherry);color:var(--cherry)}
nav.top .logo{font-family:var(--display);font-weight:400;color:var(--cherry);border-color:transparent;background:transparent}

/* hero */
.hero{padding-block:48px 72px;position:relative}
.hero-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
.hero h1{font-size:clamp(4rem,17vw,9.5rem);color:var(--ink);letter-spacing:-.01em}
.hero h1 .n{color:var(--cherry);display:block}
.age{display:inline-flex;align-items:center;gap:12px;margin-top:10px}
.age b{font-family:var(--display);font-weight:400;font-size:clamp(3.4rem,12vw,6rem);color:var(--gold);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;line-height:1}
.age span{font-weight:900;font-size:1.05rem;max-width:12ch;line-height:1.25}
.hero p.msg{font-size:1.15rem;margin:18px 0 0;max-width:40ch}
.sticker{position:absolute;font-family:var(--display);background:var(--teal);color:var(--onacc);padding:6px 14px;border-radius:12px;transform:rotate(-8deg);box-shadow:var(--shadow);font-size:1rem}

/* gift */
.gift-stage{display:flex;flex-direction:column;align-items:center;gap:16px}
.gift{position:relative;width:min(260px,70vw);aspect-ratio:1/1.05;max-width:100%;background:none;border:0;padding:0}
.gift .box{position:absolute;left:6%;right:6%;bottom:0;height:68%;background:var(--cherry);border-radius:14px;border:3px solid var(--ink);box-shadow:var(--shadow);overflow:hidden}
.gift .box::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:18%;transform:translateX(-50%);background:var(--gold);border-left:3px solid var(--ink);border-right:3px solid var(--ink)}
.gift .lid{position:absolute;left:0;right:0;top:20%;height:18%;background:var(--cherry);border:3px solid var(--ink);border-radius:12px;transition:transform .7s cubic-bezier(.3,1.6,.5,1),opacity .7s;z-index:2}
.gift .lid::before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:16%;transform:translateX(-50%);background:var(--gold);border-left:3px solid var(--ink);border-right:3px solid var(--ink)}
.gift .bow{position:absolute;left:50%;top:-38%;width:70%;height:90%;transform:translateX(-50%)}
.gift .bow::before,.gift .bow::after{content:"";position:absolute;bottom:0;width:48%;height:100%;background:var(--gold);border:3px solid var(--ink);border-radius:60% 60% 10% 60%}
.gift .bow::before{left:0;transform:rotate(-18deg);transform-origin:bottom right}
.gift .bow::after{right:0;transform:rotate(18deg) scaleX(-1);transform-origin:bottom left}
.gift:not(.open){animation:wiggle 2.6s ease-in-out infinite}
.gift.open .lid{transform:translate(30%,-150%) rotate(28deg);opacity:0}
.gift .pop{position:absolute;inset:auto 0 30% 0;text-align:center;font-family:var(--display);font-size:2.4rem;color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;opacity:0;transform:translateY(30px) scale(.6);transition:all .6s .25s cubic-bezier(.3,1.6,.5,1);z-index:1}
.gift.open .pop{opacity:1;transform:translateY(-70%) scale(1)}
.gift-hint{font-weight:800;color:var(--muted)}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-4deg)}88%{transform:rotate(4deg)}92%{transform:rotate(-3deg)}96%{transform:rotate(2deg)}}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.stat{background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:18px;box-shadow:4px 4px 0 var(--ink)}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,4.5vw,2.3rem);color:var(--cherry);font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.stat span{font-weight:800;font-size:.9rem;color:var(--muted)}
.stat:nth-child(2){transform:rotate(1deg)}.stat:nth-child(3){transform:rotate(-1deg)}

/* cake */
.cake-card{background:var(--paper);border:2px solid var(--ink);border-radius:28px;padding:28px 16px;box-shadow:6px 6px 0 var(--ink);display:flex;flex-direction:column;align-items:center;gap:18px}
.cake{position:relative;width:min(420px,100%);padding-top:70px}
.candles{position:absolute;top:0;left:6%;right:6%;height:98px;display:grid;grid-template-columns:repeat(8,1fr);row-gap:0}
.candle{position:relative;background:none;border:0;padding:0;height:49px;display:flex;justify-content:center;align-items:flex-end}
.candle i{display:block;width:10px;height:30px;border-radius:3px;border:2px solid var(--ink);background:repeating-linear-gradient(-45deg,var(--paper) 0 5px,var(--teal) 5px 9px)}
.candle:nth-child(-n+8){transform:translateY(-6px)}
.candle .flame{position:absolute;bottom:30px;left:50%;width:12px;height:18px;margin-left:-6px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fff6c2 0 25%,var(--gold) 45%,#ff7a2f 80%);animation:flick .5s ease-in-out infinite alternate;transform-origin:50% 100%;transition:opacity .3s,transform .3s}
.candle.out .flame{opacity:0;transform:scale(.2) translateY(-6px)}
.candle .smoke{position:absolute;bottom:34px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--muted);opacity:0}
.candle.out .smoke{animation:smoke 1.2s ease-out}
@keyframes flick{from{transform:rotate(-4deg) scaleY(1)}to{transform:rotate(4deg) scaleY(1.12)}}
@keyframes smoke{0%{opacity:.6;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-36px) scale(3)}}
.tier{border:3px solid var(--ink);margin:0 auto;position:relative}
.tier.t1{width:84%;height:70px;background:var(--paper);border-radius:14px 14px 6px 6px}
.tier.t1::after{content:"";position:absolute;left:-3px;right:-3px;top:-3px;height:26px;background:radial-gradient(circle at 12px 0,var(--cherry) 12px,transparent 13px) 0 0/24px 26px;border-radius:14px 14px 0 0}
.tier.t2{width:100%;height:96px;background:var(--cherry);border-radius:14px 14px 8px 8px;margin-top:-3px;display:flex;align-items:center;justify-content:center}
.tier.t2 span{font-family:var(--display);color:var(--onacc);font-size:1.8rem;-webkit-text-stroke:0}
.tier.t2::after{content:"";position:absolute;left:-3px;right:-3px;top:-3px;height:22px;background:radial-gradient(circle at 12px 0,var(--paper) 12px,transparent 13px) 0 0/24px 22px}
.plate{width:112%;margin-left:-6%;height:16px;border:3px solid var(--ink);border-radius:50%;background:var(--gold);margin-top:-6px}
.cake-status{font-weight:900;font-size:1.1rem;text-align:center}
.cake-status em{font-style:normal;color:var(--cherry)}

/* things */
.things{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.flip{perspective:900px;background:none;border:0;padding:0;aspect-ratio:1/1;max-width:100%}
.flip .in{display:block;position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:18px;border:2px solid var(--ink);display:flex;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:12px;text-align:center}
.flip .f{background:var(--paper);box-shadow:4px 4px 0 var(--ink)}
.flip .f b{font-family:var(--display);font-weight:400;font-size:clamp(2rem,7vw,3rem);color:var(--cherry)}
.flip:nth-child(3n+2) .f b{color:var(--teal)}.flip:nth-child(3n) .f b{color:var(--gold);-webkit-text-stroke:1.5px var(--ink)}
.flip .b{background:var(--cherry);color:var(--onacc);transform:rotateY(180deg);font-weight:800;font-size:clamp(.85rem,2.6vw,1.05rem);line-height:1.3;overflow-wrap:anywhere}
.flip:nth-child(even) .b{background:var(--teal)}

/* memories */
.mems{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:26px 20px}
.pol{background:#FFFDF8;padding:10px 10px 14px;border-radius:4px;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.08);transition:transform .25s;cursor:zoom-in;color:#3B0B25;border:0;text-align:left}
.pol:nth-child(odd){transform:rotate(-2.5deg)}.pol:nth-child(even){transform:rotate(2deg)}
.pol:hover{transform:rotate(0) scale(1.03)}
.pol .ph{aspect-ratio:1/1;max-width:100%;width:100%;border-radius:2px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#FFD3E1 0 14px,#FFE6EE 14px 28px)}
.pol:nth-child(3n+2) .ph{background:repeating-linear-gradient(45deg,#C9F0EC 0 14px,#E3F8F6 14px 28px)}
.pol:nth-child(3n) .ph{background:repeating-linear-gradient(45deg,#FFE7B3 0 14px,#FFF3D6 14px 28px)}
.pol .ph img{width:100%;height:100%;object-fit:cover}
.pol .ph .fb{font-family:var(--display);font-size:3rem;color:#E0245E;opacity:.55}
.pol .nice{display:block;margin:6px 4px 2px;text-align:center;font-weight:800;font-size:.86rem;line-height:1.3;color:#E0245E}
.pol p{font-family:var(--hand);font-size:1.45rem;margin:8px 4px 0;line-height:1.1;text-align:center}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(20,4,12,.85);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-left,0px));}
.lightbox .pol{max-width:min(520px,92vw);transform:rotate(-1deg);cursor:zoom-out}

/* wheel */
.two{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}
.wheel-wrap{position:relative;width:min(380px,100%);margin:0 auto}
.wheel-wrap canvas{width:100%;height:auto;display:block;aspect-ratio:1/1}
.pointer{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid var(--ink);z-index:2}
.result{background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:20px;box-shadow:4px 4px 0 var(--ink);min-height:120px}
.result b{display:block;font-family:var(--display);font-weight:400;font-size:1.6rem;color:var(--cherry);line-height:1.15;margin-top:4px}

/* game */
.game{background:var(--paper);border:2px solid var(--ink);border-radius:24px;box-shadow:6px 6px 0 var(--ink);overflow:hidden}
.game-bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:2px solid var(--ink);font-weight:900;font-variant-numeric:tabular-nums}
.game-bar .pill{background:var(--bg);border-radius:999px;padding:4px 12px;border:2px solid var(--line)}
.game canvas{display:block;width:100%;height:420px;touch-action:manipulation;background:linear-gradient(var(--paper),var(--bg))}

/* letter */
.letter{max-width:720px;margin:0 auto;background:#FFFDF8;color:#3B0B25;border-radius:6px;padding:36px clamp(20px,5vw,48px);box-shadow:var(--shadow);position:relative;transform:rotate(-.6deg);
  background-image:repeating-linear-gradient(transparent 0 37px,#F6C9D8 37px 38px);background-position:0 18px}
.letter::before{content:"";position:absolute;top:-14px;left:50%;width:120px;height:30px;transform:translateX(-50%) rotate(2deg);background:color-mix(in srgb,#0E9F9A 55%,transparent);border-radius:3px}
.letter p{font-family:var(--hand);font-size:clamp(1.45rem,4vw,1.75rem);line-height:38px;margin:0 0 38px;white-space:pre-line}
.letter .sig{text-align:right;margin:0;color:#E0245E}

/* time machine */
.tm-dial{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;justify-content:space-between;background:var(--ink);color:var(--bg);border-radius:24px;padding:18px 22px;margin-bottom:26px;box-shadow:6px 6px 0 var(--cherry)}
.tm-year{font-family:var(--display);font-size:clamp(3.4rem,15vw,6.5rem);line-height:1;color:var(--gold);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tm-year.tick{animation:tk .14s ease-out}
@keyframes tk{from{transform:translateY(-8px);opacity:.4}to{transform:none;opacity:1}}
.tm-ctrl{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.tm-lbl{font-weight:900;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.tm-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.clip{background:var(--paper);border:2px dashed var(--ink);border-radius:6px;padding:16px;transform:rotate(var(--r));transition:opacity .4s,transform .4s;min-width:0}
.clip.hide{opacity:.08;transform:rotate(var(--r)) scale(.92)}
.clip .tag{display:inline-block;font-weight:900;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;background:var(--teal);color:var(--onacc);padding:3px 9px;border-radius:999px}
.clip p{margin:10px 0 0;font-weight:700;line-height:1.45}
.clip.big{grid-column:1/-1;border-style:solid;background:var(--cherry);color:var(--onacc);text-align:center;padding:22px;transform:rotate(-.6deg)}
.clip.big .tag{background:var(--gold);color:#3B0B25}
.clip.big p{font-family:var(--display);font-weight:400;font-size:clamp(1.4rem,4.5vw,2.2rem);line-height:1.2}
.clip.big b{font-weight:400;color:var(--gold)}

/* capsule */
.capsule{background:var(--ink);color:var(--bg);border-radius:32px;padding:clamp(22px,5vw,44px);box-shadow:8px 8px 0 var(--teal);position:relative;overflow:hidden}
.capsule::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,color-mix(in srgb,var(--cherry) 35%,transparent),transparent 45%);pointer-events:none}
.capsule h2{color:var(--bg)}
.cap-top{display:flex;gap:20px;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.cap-sub{max-width:52ch;opacity:.85;margin:12px 0 0}
.lock{position:relative;flex:none;width:70px;height:86px}
.lock .shackle{position:absolute;left:14px;top:0;width:42px;height:46px;border:9px solid var(--gold);border-bottom:0;border-radius:24px 24px 0 0;transition:transform .5s;transform-origin:right bottom}
.lock .body{position:absolute;left:0;bottom:0;width:70px;height:50px;background:var(--gold);border-radius:12px}
.lock .body::after{content:"";position:absolute;left:50%;top:14px;width:10px;height:18px;margin-left:-5px;background:var(--ink);border-radius:5px}
.lock.open .shackle{transform:translateY(-12px) rotate(-25deg)}
.lock.shake{animation:shk .5s}
@keyframes shk{20%,60%{transform:translateX(-8px) rotate(-6deg)}40%,80%{transform:translateX(8px) rotate(6deg)}}
.cd{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:28px 0 14px;position:relative;z-index:1}
.cd div{background:color-mix(in srgb,var(--bg) 10%,transparent);border:2px solid color-mix(in srgb,var(--bg) 25%,transparent);border-radius:16px;padding:14px 6px;text-align:center;min-width:0}
.cd b{display:block;font-family:var(--display);font-weight:400;font-size:clamp(1.5rem,7vw,3rem);color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
.cd span{font-weight:800;font-size:.8rem;opacity:.8}
.cap-date{position:relative;z-index:1;margin:0 0 16px;opacity:.9}
.capsule .row{position:relative;z-index:1}
.cap-msg{position:relative;z-index:1;margin-top:22px;background:#FFFDF8;color:#3B0B25;border-radius:8px;padding:22px;font-family:var(--hand);font-size:1.6rem;line-height:1.35;white-space:pre-line}

/* finale */
.finale{text-align:center;padding-block:90px 110px}
.finale h2{font-size:clamp(2.8rem,11vw,6rem)}
.finale h2 span{color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;display:block}
.finale .row{justify-content:center;margin-top:28px}
footer{text-align:center;color:var(--muted);font-weight:700;padding-block:0 110px;font-size:.9rem}

/* floating */
.fab{position:fixed;z-index:30;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;align-items:flex-end}
.fab button{width:54px;height:54px;border-radius:50%;border:2px solid var(--ink);background:var(--gold);color:#3B0B25;font-weight:900;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;justify-content:center}
.fab button.on{background:var(--cherry);color:var(--onacc)}
.fab .edit{width:auto;padding:0 18px;border-radius:999px;background:var(--paper);color:var(--ink)}
.fab svg{width:24px;height:24px}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;padding:10px 18px;border-radius:999px;z-index:90;max-width:calc(100% - 32px);text-align:center}

/* editor */
.editor{position:fixed;inset:0;z-index:80;background:var(--bg);overflow-y:auto;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(120px + env(safe-area-inset-bottom,0px))}
.editor .wrap{max-width:760px}
.editor h3{font-size:1.6rem;color:var(--cherry);margin:28px 0 10px}
.editor label{display:block;font-weight:800;font-size:.9rem;margin:12px 0 4px}
.editor input[type=text],.editor input[type=date],.editor textarea{width:100%;font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink)}
.editor textarea{min-height:180px;resize:vertical}
.editor .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px}
.editor .memrow{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;margin:10px 0;padding:10px;border-radius:14px;background:var(--paper);border:2px solid var(--line)}
.editor .thumb{width:72px;height:72px;border-radius:10px;background:var(--line);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:800;color:var(--muted);text-align:center}
.editor .thumb img{width:100%;height:100%;object-fit:cover}
.editor .memrow .row{gap:8px;margin-top:6px}
.editor .memrow .btn{padding:6px 12px;font-size:.85rem;box-shadow:0 2px 0 var(--ink)}
.editor .bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:2px solid var(--ink);padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.editor .bar .wrap{display:flex;gap:10px;justify-content:flex-end}
.note{font-size:.88rem;color:var(--muted)}

@media (max-width:760px){
  section{padding-block:56px}
  .hero-grid,.two{grid-template-columns:1fr}
  .things,.tm-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .flip{aspect-ratio:3/2}
  .mems{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}
  .game canvas{height:380px}
  .editor .grid2{grid-template-columns:1fr}
  .sticker{display:none}
  .cd{gap:6px}
  .cd div{padding:10px 2px}
  .lock{width:52px;height:66px;transform:scale(.75);transform-origin:top right}
}

/* github base */
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
.ph{position:relative}
.pol .ph img,.mc .f img{position:absolute;inset:0}

/* memory match */
.match-wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:start}
.match{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.mc{perspective:800px;background:none;border:0;padding:0;aspect-ratio:3/4;max-width:100%}
.mc .in{display:block;position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d}
.mc.on .in,.mc.ok .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:14px;border:2px solid var(--ink);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;display:flex;align-items:center;justify-content:center}
.mc .b{background:var(--cherry);background-image:radial-gradient(color-mix(in srgb,var(--onacc) 35%,transparent) 2px,transparent 2.5px);background-size:14px 14px;box-shadow:3px 3px 0 var(--ink)}
.mc .b span{font-family:var(--display);font-size:clamp(1.4rem,5vw,2.2rem);color:var(--gold);-webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill}
.mc .f{transform:rotateY(180deg);background:var(--gold)}
.mc .f img{width:100%;height:100%;object-fit:cover}
.mc .f span{font-family:var(--display);font-size:2.4rem;color:#3B0B25}
.mc.ok .f{box-shadow:0 0 0 4px var(--teal)}
.mc.ok{animation:okpop .4s}
@keyframes okpop{50%{transform:scale(1.08)}}
.panel{background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:20px;box-shadow:4px 4px 0 var(--ink)}
.panel .big{font-family:var(--display);font-size:2.4rem;color:var(--cherry);line-height:1;font-variant-numeric:tabular-nums}
.panel dl{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 16px}
.panel dt{font-weight:900;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.panel dd{margin:0}
.panel .msg{font-weight:800;margin:0 0 14px;min-height:3em}

/* scratch coupons */
.coupons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.coupon{position:relative;border-radius:18px;border:2px dashed var(--ink);background:var(--paper);min-height:190px;overflow:hidden;box-shadow:4px 4px 0 var(--ink)}
.coupon:nth-child(2){transform:rotate(1.2deg)}.coupon:nth-child(3){transform:rotate(-1deg)}
.coupon .inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:18px;gap:6px}
.coupon .inner small{font-weight:900;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--teal)}
.coupon .inner b{font-family:var(--display);font-weight:400;font-size:clamp(1.25rem,3.6vw,1.6rem);color:var(--cherry);line-height:1.15}
.coupon .inner span{font-size:.85rem;font-weight:700;color:var(--muted)}
.coupon canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair;transition:opacity .6s}
.coupon.done canvas{opacity:0;pointer-events:none}

/* lanterns */
.sky{position:relative;border-radius:28px;overflow:hidden;border:2px solid var(--ink);box-shadow:6px 6px 0 var(--gold);background:#120618}
.sky canvas{display:block;width:100%;height:440px}
.sky-form{position:absolute;left:0;right:0;bottom:0;display:flex;gap:10px;padding:16px;background:linear-gradient(transparent,rgba(10,2,14,.85))}
.sky-form input{flex:1;min-width:0;font:inherit;font-size:16px;padding:12px 16px;border-radius:999px;border:2px solid #FFC24D;background:rgba(255,255,255,.08);color:#FFF3D6}
.sky-form input::placeholder{color:#E9C9A4}
.sky-count{position:absolute;top:14px;left:16px;color:#FFE6B0;font-weight:800;font-size:.9rem;background:rgba(0,0,0,.35);padding:4px 12px;border-radius:999px}

@media (max-width:760px){
  .match-wrap{grid-template-columns:1fr}
  .coupons{grid-template-columns:1fr}
  .coupon{min-height:150px}
  .sky canvas{height:400px}
  .match{gap:8px}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

/* ---------- Interactions ---------- */
function wire(){
  var gift=$('#gift');
  gift.addEventListener('click',function(){
    if(gift.classList.contains('open')){confetti(120);return}
    gift.classList.add('open');$('#giftHint').textContent='Müzik başladı! Aşağı kaydır';
    var r=gift.getBoundingClientRect();confetti(160,r.left+r.width/2,r.top+r.height/2);confetti(120);setMusic(true);fireworks(4);
  });

  // cake
  var candles=$$('.candle'),status=$('#cakeStatus'),done=false;
  function upd(){var lit=candles.filter(function(c){return!c.classList.contains('out')}).length;
    if(lit===0){status.innerHTML='<em>Dileğin tutuldu!</em> Şimdi gerçek olmasını bekle.';if(!done){done=true;confetti(220);fireworks(6);blip(784,.5)}}
    else{done=false;status.innerHTML='<em>'+lit+'</em> mum hâlâ yanıyor'+(lit===candles.length?'. Önce bir dilek tut.':'')}}
  candles.forEach(function(c,i){c.addEventListener('click',function(){if(c.classList.contains('out'))return;c.classList.add('out');blip(500+i*30,.12);upd()})});
  $('#blowAll').addEventListener('click',function(){candles.forEach(function(c,i){setTimeout(function(){c.classList.add('out');if(i===candles.length-1)upd()},i*55)})});
  $('#relight').addEventListener('click',function(){candles.forEach(function(c){c.classList.remove('out')});upd()});
  upd();

  // things
  $$('.flip').forEach(function(f,i){f.addEventListener('click',function(){f.classList.toggle('on');if(f.classList.contains('on'))blip(660+i*20,.1);
    if($$('.flip.on').length===16){var r=f.getBoundingClientRect();confetti(90,r.left+r.width/2,r.top)}})});
  $('#flipAll').addEventListener('click',function(){var all=$$('.flip'),on=all.every(function(f){return f.classList.contains('on')});
    all.forEach(function(f,i){setTimeout(function(){f.classList.toggle('on',!on)},i*60)});this.textContent=on?'Hepsini çevir':'Hepsini geri çevir'});

  // memories lightbox
  $$('.pol').forEach(function(p){p.addEventListener('click',function(){var lb=document.createElement('div');lb.className='lightbox';
    var clone=p.cloneNode(true);lb.appendChild(clone);lb.addEventListener('click',function(){lb.remove()});
    document.body.appendChild(lb);clone.focus()})});

  initWheel();initGame();initTime();initCapsule();initMatch();initScratch();initLanterns();

  $('#boom').addEventListener('click',function(){audio();fireworks(12);confetti(200);if(!musicOn)setMusic(true)});
  $('#again').addEventListener('click',function(){scrollTo({top:0,behavior:reduce?'auto':'smooth'});var g=$('#gift');g.classList.remove('open');$('#giftHint').textContent='Kutuya dokun';
    $$('.candle').forEach(function(c){c.classList.remove('out')});$$('.flip').forEach(function(f){f.classList.remove('on')});$('#cakeStatus').innerHTML='<em>'+age+'</em> mum hâlâ yanıyor. Önce bir dilek tut.'});
  $('#musicBtn').addEventListener('click',function(){setMusic(!musicOn)});
}

/* wheel */
function initWheel(){
  var cv=$('#wheel'),c=cv.getContext('2d'),items=(DATA.wheel||[]).filter(Boolean);if(!items.length)items=['Mutluluk'];
  var n=items.length,rot=0,spinning=false,cols=[col('--cherry'),col('--gold'),col('--teal'),col('--paper')];
  var ink=col('--ink');
  function wrapText(t,max){var w=t.split(' '),lines=[],cur='';w.forEach(function(x){var tt=cur?cur+' '+x:x;if(c.measureText(tt).width>max&&cur){lines.push(cur);cur=x}else cur=tt});lines.push(cur);return lines.slice(0,3)}
  function draw(){var R=370,cx=380,cy=380;c.clearRect(0,0,760,760);
    c.save();c.translate(cx,cy);c.rotate(rot);
    for(var i=0;i<n;i++){var a0=i*2*Math.PI/n,a1=(i+1)*2*Math.PI/n,fill=cols[i%4];if(n%4===1&&i===n-1)fill=cols[1];
      c.beginPath();c.moveTo(0,0);c.arc(0,0,R-8,a0,a1);c.closePath();c.fillStyle=fill;c.fill();c.lineWidth=6;c.strokeStyle=ink;c.stroke();
      c.save();c.rotate((a0+a1)/2);c.textAlign='right';c.fillStyle=(fill===cols[0]||fill===cols[2])?'#FFF7FA':'#3B0B25';
      if(fill===cols[3])c.fillStyle=ink;
      c.font='800 26px Nunito, system-ui, sans-serif';var ls=wrapText(items[i],210);
      ls.forEach(function(l,k){c.fillText(l,R-36,(k-(ls.length-1)/2)*28+9)});c.restore()}
    c.restore();
    c.beginPath();c.arc(cx,cy,R-4,0,7);c.lineWidth=10;c.strokeStyle=ink;c.stroke();
    c.beginPath();c.arc(cx,cy,48,0,7);c.fillStyle=col('--paper');c.fill();c.lineWidth=6;c.stroke();
    c.fillStyle=col('--cherry');c.font='44px Shrikhand, Georgia, serif';c.textAlign='center';c.fillText(String(age),cx,cy+15)}
  draw();if(document.fonts)document.fonts.ready.then(draw);
  $('#spin').addEventListener('click',function(){if(spinning)return;spinning=true;
    var target=rot+Math.PI*2*(4+Math.random()*1.5)+Math.random()*Math.PI*2,start=rot,t0=performance.now(),dur=reduce?300:13000+Math.random()*2000,lastTick=-1;
    var spinBtn=$('#spin');spinBtn.disabled=true;spinBtn.textContent='Dönüyor…';var teas=['Çark dönüyor…','Yavaşlıyor…','Neredeyse…','Ve…'];
    (function f(t){var k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);rot=start+(target-start)*e;draw();
      var ti=Math.min(3,Math.floor(k*4));if(k<1)$('#wheelRes').innerHTML='<span class="note">Bekle bakalım</span><b>'+teas[ti]+'</b>';
      var seg=Math.floor((rot%(Math.PI*2))/(Math.PI*2/n));if(seg!==lastTick){lastTick=seg;if(k<.97)blip(900,.03)}
      if(k<1)requestAnimationFrame(f);else{spinning=false;spinBtn.disabled=false;spinBtn.textContent='Tekrar çevir';
        var ang=((-Math.PI/2-rot)%(Math.PI*2)+Math.PI*2)%(Math.PI*2),idx=Math.floor(ang/(Math.PI*2/n));
        $('#wheelRes').innerHTML='<span class="note">Çark konuştu</span><b>'+esc(items[idx])+'</b>';
        var r=cv.getBoundingClientRect();confetti(80,r.left+r.width/2,r.top+30);blip(1046,.3)}})(t0)});
}

/* balloon game */
function initGame(){
  var cv=$('#game'),c=cv.getContext('2d'),W=0,H=0,balloons=[],pops=[],score=0,left=20,playing=false,last=0,spawnAcc=0,best=0,timerId=null;
  try{best=+localStorage.getItem('elizan-balon')||0}catch(e){}
  $('#gBest').textContent=best;
  var words=['Mutluluk','Kahkaha','Macera','Şans','Sağlık','Başarı','Dostluk','Huzur','Cesaret','Neşe','Sürpriz','Umut'];
  function size(){var r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;c.setTransform(d,0,0,d,0,0);if(!playing)idle()}
  function spawn(){var gold=Math.random()<.15,cs=[col('--cherry'),col('--teal'),'#9B5DE5','#FF8A3D'];
    var r=gold?24:26+Math.random()*12;
    balloons.push({x:r+Math.random()*(W-2*r),y:H+r+10,r:r,vy:(1.1+Math.random()*1.4)*(H/400)*(1+(20-left)*.03),sway:Math.random()*6.28,c:gold?col('--gold'):cs[Math.floor(Math.random()*4)],gold:gold})}
  function drawBalloon(b){c.save();c.translate(b.x+Math.sin(b.sway)*6,b.y);
    c.strokeStyle=col('--ink');c.lineWidth=1.5;c.beginPath();c.moveTo(0,b.r*1.15);c.quadraticCurveTo(8,b.r*1.6,0,b.r*2.2);c.stroke();
    c.beginPath();c.ellipse(0,0,b.r*.88,b.r*1.1,0,0,7);c.fillStyle=b.c;c.fill();c.lineWidth=2.5;c.stroke();
    c.beginPath();c.moveTo(-5,b.r*1.08);c.lineTo(5,b.r*1.08);c.lineTo(0,b.r*1.22);c.closePath();c.fillStyle=b.c;c.fill();c.stroke();
    c.beginPath();c.ellipse(-b.r*.35,-b.r*.4,b.r*.15,b.r*.25,-.5,0,7);c.fillStyle='rgba(255,255,255,.55)';c.fill();
    if(b.gold){c.fillStyle='#3B0B25';c.font='800 14px Nunito, sans-serif';c.textAlign='center';c.fillText('x3',0,5)}c.restore()}
  function idle(){c.clearRect(0,0,W,H);c.fillStyle=col('--muted');c.textAlign='center';c.font='800 18px Nunito, sans-serif';
    c.fillText(score?'Süre doldu! '+score+' puan topladın.':'Başlat tuşuna bas, balonlar gelsin',W/2,H/2);
    [[.2,.75],[.5,.7],[.8,.78]].forEach(function(p,i){drawBalloon({x:W*p[0],y:H*p[1]-10,r:24,sway:i,c:[col('--cherry'),col('--gold'),col('--teal')][i],gold:false})})}
  function loop(t){if(!playing)return;var dt=Math.min(50,t-(last||t));last=t;spawnAcc+=dt;
    if(spawnAcc>520-(20-left)*12){spawnAcc=0;spawn()}
    c.clearRect(0,0,W,H);
    for(var i=balloons.length-1;i>=0;i--){var b=balloons[i];b.y-=b.vy*dt/16;b.sway+=.03;if(b.y<-b.r*3){balloons.splice(i,1);continue}drawBalloon(b)}
    for(var j=pops.length-1;j>=0;j--){var p=pops[j];p.t+=dt;var k=p.t/900;if(k>=1){pops.splice(j,1);continue}
      c.globalAlpha=1-k;c.fillStyle=col('--ink');c.font='900 18px Nunito, sans-serif';c.textAlign='center';c.fillText(p.w,p.x,p.y-k*40);
      c.strokeStyle=p.c;c.lineWidth=3;for(var a=0;a<8;a++){var an=a*Math.PI/4,r1=10+k*30;c.beginPath();c.moveTo(p.x+Math.cos(an)*r1*.5,p.y+Math.sin(an)*r1*.5);c.lineTo(p.x+Math.cos(an)*r1,p.y+Math.sin(an)*r1);c.stroke()}
      c.globalAlpha=1}
    requestAnimationFrame(loop)}
  function hit(e){if(!playing)return;var r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    for(var i=balloons.length-1;i>=0;i--){var b=balloons[i],bx=b.x+Math.sin(b.sway)*6;if(Math.pow((x-bx)/(b.r*1.05),2)+Math.pow((y-b.y)/(b.r*1.25),2)<=1.3){
      balloons.splice(i,1);score+=b.gold?3:1;$('#gScore').textContent=score;pops.push({x:bx,y:b.y,t:0,c:b.c,w:b.gold?'+3 '+words[Math.floor(Math.random()*words.length)]:words[Math.floor(Math.random()*words.length)]});blip(b.gold?1200:700+Math.random()*300,.08);break}}}
  cv.addEventListener('pointerdown',hit);
  $('#gStart').addEventListener('click',function(){if(playing)return;audio();playing=true;score=0;left=20;balloons=[];pops=[];last=0;spawnAcc=400;
    $('#gScore').textContent=0;$('#gTime').textContent=20;this.disabled=true;this.textContent='Oyun sürüyor';requestAnimationFrame(loop);
    var btn=this;timerId=setInterval(function(){left--;$('#gTime').textContent=left;if(left<=0){clearInterval(timerId);playing=false;btn.disabled=false;btn.textContent='Tekrar oyna';
      if(score>best){best=score;try{localStorage.setItem('elizan-balon',best)}catch(e){}$('#gBest').textContent=best;toast('Yeni rekor: '+best+' puan!');var r=cv.getBoundingClientRect();confetti(120,r.left+r.width/2,r.top+r.height/2)}
      setTimeout(idle,50)}},1000)});
  size();addEventListener('resize',size);
}

/* time machine */
function initTime(){
  var el=$('#tmYear'),busy=false;
  $('#tmGo').addEventListener('click',function(){if(busy)return;busy=true;var from=2026,y=from,steps=from-BIRTH_YEAR;

/* capsule */
function initCapsule(){
  var target=capDate(),opened=false,msg=$('#capMsg'),btn=$('#capOpen');
  function pad(n){return String(n).padStart(2,'0')}
  function tick(){var diff=target-new Date();
    if(diff<=0){$('#cdD').textContent='0';$('#cdH').textContent=$('#cdM').textContent=$('#cdS').textContent='00';btn.textContent='Kapsülü aç';btn.disabled=false;return false}
    var s=Math.floor(diff/1000);$('#cdD').textContent=fmt(Math.floor(s/86400));$('#cdH').textContent=pad(Math.floor(s%86400/3600));$('#cdM').textContent=pad(Math.floor(s%3600/60));$('#cdS').textContent=pad(s%60);return true}
  var running=tick();if(running){var iv=setInterval(function(){if(!tick())clearInterval(iv)},1000)}
  btn.addEventListener('click',function(){
    if(new Date()<target){var l=$('#lock');l.classList.remove('shake');void l.offsetWidth;l.classList.add('shake');blip(160,.25);
      toast('Kilitli! Biraz daha sabır, '+(age+1)+'. doğum gününü bekle.');return}
    if(opened)return;opened=true;$('#lock').classList.add('open');msg.hidden=false;msg.textContent=dec(DATA.capsule)||'Mutlu yıllar!';
    var r=btn.getBoundingClientRect();confetti(160,r.left+r.width/2,r.top);fireworks(6);blip(1046,.5)});
}


/* photo helper: shows the number when the file is missing */
function photo(src,alt,fallback){
  return '<span class="fb">'+fallback+'</span>'+(src?'<img src="'+esc(src)+'" alt="'+esc(alt)+'" loading="lazy" onerror="this.remove()">':'');
}

/* memory match */
function initMatch(){
  var box=$('#match'),mems=(DATA.memories||[]).slice(0,4),deck=[],first=null,lock=false,moves=0,pairs=0,t0=0,timer=null;
  var best=0;try{best=+localStorage.getItem('elizan-eslestir')||0}catch(e){}
  function show(){$('#mMoves').textContent=moves;$('#mPairs').textContent=pairs+' / '+mems.length;$('#mBest').textContent=best?best+' hamle':'—'}
  function deal(){
    deck=[];mems.forEach(function(m,i){deck.push(i,i)});
    for(var i=deck.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=deck[i];deck[i]=deck[j];deck[j]=t}
    first=null;lock=false;moves=0;pairs=0;t0=0;clearInterval(timer);$('#mTime').textContent='0 sn';
    $('#mMsg').textContent='Kartlara dokun, aynı iki fotoğrafı bul.';
    box.innerHTML=deck.map(function(k,i){var m=mems[k];return '<button class="mc" data-k="'+k+'" aria-label="Kart '+(i+1)+'"><span class="in"><span class="b"><span>?</span></span><span class="f">'+photo(m.img,m.cap,k+1)+'</span></span></button>'}).join('');
    $$('.mc',box).forEach(function(c){c.addEventListener('click',function(){flip(c)})});
    show();
  }
  function flip(c){
    if(lock||c.classList.contains('on')||c.classList.contains('ok'))return;
    if(!t0){t0=Date.now();timer=setInterval(function(){$('#mTime').textContent=Math.floor((Date.now()-t0)/1000)+' sn'},500)}
    c.classList.add('on');blip(620,.07);
    if(!first){first=c;return}
    moves++;var a=first;first=null;
    if(a.dataset.k===c.dataset.k){a.classList.add('ok');c.classList.add('ok');pairs++;blip(990,.15);
      var mk=mems[+c.dataset.k];$('#mMsg').textContent=mk.nice?mk.nice+'!':'"'+(mk.cap||'Eşleşme')+'" bulundu!';
      if(pairs===mems.length){clearInterval(timer);var sec=Math.floor((Date.now()-t0)/1000);
        $('#mMsg').textContent='Tamamladın! '+moves+' hamle, '+sec+' saniye.';
        if(!best||moves<best){best=moves;try{localStorage.setItem('elizan-eslestir',best)}catch(e){}toast('Yeni rekor: '+moves+' hamle!')}
        var r=box.getBoundingClientRect();confetti(140,r.left+r.width/2,r.top+r.height/2);blip(1320,.4)}
    }else{lock=true;setTimeout(function(){a.classList.remove('on');c.classList.remove('on');lock=false},800)}
    show();
  }
  $('#mReset').addEventListener('click',deal);
  deal();
}

/* scratch coupons */
function initScratch(){
  $$('.coupon').forEach(function(cp){
    var cv=$('canvas',cp),c=cv.getContext('2d'),down=false,W=0,H=0,done=false;
    function paint(){var r=cp.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;c.setTransform(d,0,0,d,0,0);
      if(done)return;c.globalCompositeOperation='source-over';
      var g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#F5B841');g.addColorStop(.5,'#FFE08A');g.addColorStop(1,'#E59A1C');c.fillStyle=g;c.fillRect(0,0,W,H);
      c.fillStyle='rgba(59,11,37,.12)';for(var y=0;y<H;y+=16)for(var x=(y/16%2)*8;x<W;x+=16){c.beginPath();c.arc(x,y,2,0,7);c.fill()}
      c.fillStyle='#3B0B25';c.textAlign='center';c.font='26px Shrikhand, Georgia, serif';c.fillText('KAZI',W/2,H/2+4);
      c.font='800 13px Nunito, sans-serif';c.fillText('parmağınla sürt',W/2,H/2+28)}
    function pos(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
    var last=null;
    function scratch(p){c.globalCompositeOperation='destination-out';c.lineWidth=38;c.lineCap='round';c.lineJoin='round';
      c.beginPath();if(last){c.moveTo(last.x,last.y)}else{c.moveTo(p.x,p.y)}c.lineTo(p.x+.1,p.y+.1);c.stroke();last=p}
    function check(){if(done)return;var d=c.getImageData(0,0,cv.width,cv.height).data,clear=0,tot=0;
      for(var i=3;i<d.length;i+=4*24){tot++;if(d[i]<40)clear++}
      if(clear/tot>.5){done=true;cp.classList.add('done');var r=cp.getBoundingClientRect();confetti(90,r.left+r.width/2,r.top+r.height/2);blip(1046,.3)}}
    cv.addEventListener('pointerdown',function(e){down=true;last=null;try{cv.setPointerCapture(e.pointerId)}catch(_){};scratch(pos(e));if(Math.random()<.5)blip(240+Math.random()*80,.04)});
    cv.addEventListener('pointermove',function(e){if(down)scratch(pos(e))});
    function up(){if(!down)return;down=false;last=null;check()}
    cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
    paint();if(document.fonts)document.fonts.ready.then(function(){if(!done)paint()});
    addEventListener('resize',function(){if(!done)paint()});
  });
}

/* wish lanterns */
function initLanterns(){
  var cv=$('#sky'),c=cv.getContext('2d'),W=0,H=0,stars=[],lan=[],sparks=[],count=0;
  var seed=['Hep böyle gül','Bol kahkahalı bir yıl','Tüm dileklerin gerçek olsun'];
  function size(){var r=cv.getBoundingClientRect(),d=Math.min(window.devicePixelRatio||1,2);if(!r.width)return;W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;c.setTransform(d,0,0,d,0,0);
    stars=[];for(var i=0;i<Math.round(W*H/2200);i++)stars.push({x:Math.random()*W,y:Math.random()*H*.85,r:Math.random()*1.4+.3,p:Math.random()*6.28})}
  function add(text,opts){opts=opts||{};
    lan.push({x:opts.x!=null?opts.x:W*(.25+Math.random()*.5),y:opts.y!=null?opts.y:H-120,vy:opts.vy!=null?opts.vy:2.6,min:.5+Math.random()*.25,
      sw:Math.random()*6.28,s:opts.s||1.3,text:text,age:0,mine:!!opts.mine})}
  function drawLantern(l){var s=l.s,x=l.x+Math.sin(l.sw)*10,y=l.y;
    var glow=c.createRadialGradient(x,y,2,x,y,(l.mine&&l.age<60?90:60)*s);glow.addColorStop(0,'rgba(255,190,90,.6)');glow.addColorStop(1,'rgba(255,150,60,0)');
    c.fillStyle=glow;c.beginPath();c.arc(x,y,90*s,0,7);c.fill();
    c.beginPath();c.moveTo(x-16*s,y-22*s);c.quadraticCurveTo(x,y-30*s,x+16*s,y-22*s);c.lineTo(x+12*s,y+18*s);c.quadraticCurveTo(x,y+22*s,x-12*s,y+18*s);c.closePath();
    var g=c.createLinearGradient(x,y-26*s,x,y+20*s);g.addColorStop(0,'#FF7A3D');g.addColorStop(1,'#FFD36B');c.fillStyle=g;c.fill();
    c.fillStyle='rgba(255,250,220,.95)';c.beginPath();c.ellipse(x,y+14*s,5*s,3*s,0,0,7);c.fill();
    var life=l.mine?420:260;
    if(l.age<life&&l.text){c.globalAlpha=Math.max(0,1-l.age/life);c.font='800 '+(l.mine?17:15)+'px Nunito, sans-serif';c.textAlign='center';
      var tw=c.measureText(l.text).width,tx=Math.min(Math.max(x,tw/2+12),W-tw/2-12);c.fillStyle='rgba(10,2,14,.55)';c.fillRect(tx-tw/2-8,y+30*s,tw+16,24);
      c.fillStyle='#FFF3D6';c.fillText(l.text,tx,y+30*s+17);c.globalAlpha=1}
    if(l.mine&&Math.random()<.6)sparks.push({x:x+(Math.random()-.5)*14*s,y:y+20*s,vy:.6+Math.random(),vx:(Math.random()-.5)*.6,a:1})}
  function frame(t){
    if(!W)size();
    if(W){c.clearRect(0,0,W,H);
      var sky=c.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#0B0420');sky.addColorStop(1,'#3A0D2E');c.fillStyle=sky;c.fillRect(0,0,W,H);
      stars.forEach(function(s){c.globalAlpha=.4+.6*Math.abs(Math.sin(t/900+s.p));c.fillStyle='#FFFFFF';c.beginPath();c.arc(s.x,s.y,s.r,0,7);c.fill()});c.globalAlpha=1;
      for(var k=sparks.length-1;k>=0;k--){var p=sparks[k];p.y+=p.vy;p.x+=p.vx;p.a-=.025;if(p.a<=0){sparks.splice(k,1);continue}
        c.globalAlpha=p.a;c.fillStyle='#FFD36B';c.beginPath();c.arc(p.x,p.y,1.6,0,7);c.fill()}c.globalAlpha=1;
      c.fillStyle='#1A0716';c.beginPath();c.moveTo(0,H);for(var x=0;x<=W;x+=40)c.lineTo(x,H-30-Math.sin(x/90)*14-Math.cos(x/37)*6);c.lineTo(W,H);c.fill();
      for(var i=lan.length-1;i>=0;i--){var l=lan[i];l.vy=Math.max(l.min,l.vy*.992);l.y-=l.vy;l.sw+=.012;l.age++;
        l.s=Math.max(.3,(l.mine?1.3:1)*Math.min(1,(l.y+60)/H*1.1));
        if(l.y<-90){lan.splice(i,1);continue}drawLantern(l)}
      if(lan.length<4&&Math.random()<.004)add('',{y:H+40,vy:.6,s:1});
    }
    requestAnimationFrame(frame)}
  size();seed.forEach(function(s,i){add(s,{y:H*(.22+i*.22),vy:.45,s:1})});
  var countEl=$('#skyCount');countEl.textContent='Bir dilek yaz ve feneri uçur';
  addEventListener('resize',size);
  requestAnimationFrame(frame);
  var inp=$('#wish'),btn=$('#skyGo');
  function launch(){var v=inp.value.trim().slice(0,40);
    if(!v){inp.focus();countEl.textContent='Önce bir dilek yaz';return}
    add(v,{mine:true});count++;inp.value='';inp.blur();
    countEl.textContent='Dileğin gökyüzüne uçtu! ('+count+' fener)';
    blip(523,.2);setTimeout(function(){blip(784,.3)},150);
    var r=cv.getBoundingClientRect();if(r.top<0||r.bottom>innerHeight)cv.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'})}
  btn.addEventListener('click',function(e){e.preventDefault();launch()});
  inp.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();launch()}});
  $('#skyForm').addEventListener('submit',function(e){e.preventDefault()});
}

render();
})();
